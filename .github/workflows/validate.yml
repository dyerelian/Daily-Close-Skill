name: validate

on:
  push:
  pull_request:

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python scripts/validate_config.py --config config/daily-close.example.json --json
      - run: python scripts/onboard_close_day.py run --answers config/onboarding.answers.example.json --dry-run
      - run: python scripts/install_close_day.py install --dry-run --skip-onboarding
